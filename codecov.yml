# Score only the core embedded-audio crate (crates/embedded-audio). Sibling
# crates (live, studio, codegen) and non-library trees are excluded from Codecov.
ignore:
  - "crates/embedded-audio-*/**"
  - "crates/embedded-audio/tools/**"
  - "benches/**"
  - "examples/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - crates/embedded-audio
    patch:
      default:
        target: 60%
        threshold: 1%
        paths:
          - crates/embedded-audio
