[package]
name = "embedded-audio"
version = "0.2.0"
edition = "2024"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/embedded-audio"
description = "no_std duty-modulated PWM audio: effect banks, tiered DSP, and mixing for Cortex-M"
keywords = ["embedded", "audio", "pwm", "dsp", "no-std"]
categories = ["embedded", "no-std"]
readme = "README.md"

[features]
default = []
std = []
fm = []

[dependencies]
heapless = "0.9"

[dev-dependencies]
heapless = "0.9"

[lib]
name = "embedded_audio"
path = "src/lib.rs"

[[bin]]
name = "eaf-bake"
path = "tools/bake/main.rs"
required-features = ["std"]

[[bin]]
name = "eaf-preview"
path = "tools/preview/main.rs"
required-features = ["std"]

[[test]]
name = "tiers"
path = "tests/tiers.rs"

[[test]]
name = "fm"
path = "tests/fm.rs"
required-features = ["fm"]

[[test]]
name = "buffer_and_bake"
path = "tests/buffer_and_bake.rs"

[[test]]
name = "preview"
path = "tests/preview.rs"
required-features = ["std"]
